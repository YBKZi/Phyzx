<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1930">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<title>Phyzx</title>
<style>
  /* Sfondo fissato su html/body: senza questo, il bianco (o nero) di default del browser
     si vede per un istante prima che React monti, o ai bordi durante lo scroll elastico
     su iOS/PWA quando il contenuto è più corto della viewport reale. Il valore di --bg-app
     viene impostato dallo script inline sotto, PRIMA che questo <style> venga applicato dal
     browser, leggendo il tema salvato in precedenza (dark di default per chi non ha ancora
     scelto), così non si vede mai un flash dello sfondo sbagliato al caricamento. */
  html, body {
    background: var(--bg-app, #1B1930);
    margin: 0;
    height: 100%;
    touch-action: manipulation; /* evita lo zoom da doppio-tap su mobile, senza bloccare lo scroll */
  }
  #root {
    min-height: 100%;
  }
</style>
<script>
  // Applica subito (prima del primo paint) le variabili del tema scuro fisso dell'app, per evitare
  // un flash dello sfondo di default del browser prima che React monti.
  (function () {
    var dark = {
      '--bg-app': '#1B1930', '--bg-app-2': '#211F38', '--bg-card': '#252341', '--bg-card-active': '#2E2C4A',
      '--border': '#3A3856', '--border-strong': '#4A4870', '--text-tertiary': '#6E6C8E',
      '--text-secondary': '#9694B0', '--text-primary-dim': '#D4D2E8', '--text-primary': '#EDEBFF',
    };
    try {
      for (var key in dark) document.documentElement.style.setProperty(key, dark[key]);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark['--bg-app']);
    } catch (e) { /* localStorage/CSS custom properties non disponibili: resta il fallback statico sopra */ }
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
